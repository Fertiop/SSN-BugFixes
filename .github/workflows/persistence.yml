name: Persisted terminal regression (two Forge server boots)

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  disk-restart:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: gradle/actions/setup-gradle@v4
      - name: Pre-fetch Minecraft assets with retries (network-only failures)
        run: |
          chmod +x ./gradlew
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon --console=plain downloadAssets; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Minecraft asset downloads failed after 3 attempts"
              exit 1
            fi
            sleep "$((attempt * 10))"
          done
      - name: Fully start, persist and restart Forge server
        run: |
          chmod +x ./gradlew
          python -u tests/integration/persistent_world_smoke.py
      - name: Save both Forge start logs and region metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssn-real-world-restart-evidence
          path: |
            build/persistence-smoke/server-*.log
            run/logs/
            run/crash-reports/
          if-no-files-found: ignore
