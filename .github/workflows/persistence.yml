name: Persisted terminal regression (two Forge server boots)

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disk-restart:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: gradle/actions/setup-gradle@v4
      - name: Fully start, persist and restart Forge server
        run: |
          chmod +x ./gradlew
          python -u tests/integration/persistent_world_smoke.py
      - name: Save both Forge start logs and region metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssn-real-world-restart-evidence
          path: |
            build/persistence-smoke/server-*.log
            run/logs/
            run/crash-reports/
          if-no-files-found: ignore
